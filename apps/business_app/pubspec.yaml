name: business_app
description: Ganacsi business app (Android/iOS) for owners, managers, cashiers, sellers.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  get: ^4.6.6
  get_storage: ^2.1.1
  supabase_flutter: ^2.8.0

  # Shared workspace packages
  core:
    path: ../../packages/core

  domain:
    path: ../../packages/domain

  data:
    path: ../../packages/data

  auth:
    path: ../../packages/auth

  ui_kit:
    path: ../../packages/ui_kit

  localization:
    path: ../../packages/localization

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true